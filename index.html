<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24425F">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.png">
<title>JSPC 学習チェック</title>
<style>
:root{
  --navy:#24425F; --paper:#F7F5F0; --ink:#1E2A36; --sub:#5A6B7A;
  --green:#2E7D32; --greenbg:#C6EFCE; --line:#DDD6C8; --card:#FFFFFF;
  --p1:#EEF3F8; --p2:#EDF7EE; --p3:#FBF3E4; --adj:#F4F4F4; --final:#FBEAEA; --exam:#F9DDDD; --rest:#E8E8E8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);
  font-family:"Yu Gothic UI","Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.55;padding-bottom:76px}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;background:var(--navy);color:#fff}
.tname{font-weight:700;font-size:14px;letter-spacing:.06em}
.chip{font-size:11px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);
  border-radius:99px;padding:3px 10px}
main{max-width:560px;margin:0 auto;padding:14px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(30,42,54,.05)}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--sub);margin-bottom:4px}
.bigdate{font-size:22px;font-weight:800}
.wkcard{border-left:6px solid var(--navy);padding:12px 14px;border-radius:12px;background:var(--card);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:12px}
.badge{display:inline-block;font-size:11px;font-weight:700;color:var(--ink);background:var(--adj);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.badge.p1{background:var(--p1)} .badge.p2{background:var(--p2)} .badge.p3{background:var(--p3)}
.badge.adj{background:var(--adj)} .badge.final{background:var(--final)} .badge.exam{background:var(--exam)} .badge.rest{background:var(--rest)}
.theme{font-size:14px;font-weight:700}
.td{font-size:12px;color:var(--sub);margin-top:2px}
.bar{height:8px;background:#ECE7DC;border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .3s}
.bar>i.g{background:var(--green)}
.bartext{font-size:11px;color:var(--sub);margin-top:4px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.day{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 2px;text-align:center;cursor:pointer;min-height:52px}
.day .w{display:block;font-size:11px;color:var(--sub)}
.day .q{display:block;font-size:11px;font-weight:700;margin-top:2px}
.day.on{background:var(--greenbg);border-color:var(--green)}
.day.on .w,.day.on .q{color:var(--green)}
.day.me{outline:2px solid var(--navy);outline-offset:-2px}
.day.dim{opacity:.55}
.stampwrap{text-align:center;padding:8px 0 2px}
.stamp{width:104px;height:104px;border-radius:50%;border:3px solid var(--navy);background:var(--navy);
  color:#fff;font-size:17px;font-weight:800;letter-spacing:.08em;cursor:pointer;
  display:inline-flex;align-direction:column;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.stamp small{font-size:11px;font-weight:400;opacity:.85}
.stamp.done{border-color:var(--green);background:var(--greenbg);color:var(--green)}
.stamp.done .mark{font-size:34px;line-height:1}
@keyframes stampin{0%{transform:scale(1.5) rotate(-8deg);opacity:.4}60%{transform:scale(.94) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
.stamp.done .mark{animation:stampin .28s ease-out}
.streak{font-size:12px;color:var(--sub);margin-top:8px}
.qrange{font-size:18px;font-weight:800;margin-bottom:10px;line-height:1.3}
.pgline{font-size:11.5px;color:var(--sub);margin-bottom:10px;word-break:break-all}
.day.rst{background:#EFE9F4;border-color:#B8AFC4}
.dot.r{background:#B8AFC4;border-color:#B8AFC4}
.note{font-size:11px;color:var(--sub)}
.wrow{display:grid;grid-template-columns:52px 1fr 84px;gap:10px;align-items:center;cursor:pointer}
.wnum{font-weight:800;font-size:13px;color:var(--navy)}
.wdate{font-size:10px;color:var(--sub)}
.wtheme{font-size:12px;font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dots{display:flex;gap:3px;justify-content:flex-end}
.dot{width:9px;height:9px;border-radius:50%;background:#E3DDCF;border:1px solid var(--line)}
.dot.on{background:var(--green);border-color:var(--green)}
.sep{font-size:11px;letter-spacing:.14em;color:var(--sub);margin:14px 4px 6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.stat .v{font-size:22px;font-weight:800;color:var(--navy)}
.stat .l{font-size:10px;color:var(--sub);letter-spacing:.08em}
.pbar{margin-bottom:10px}
.pbar .row{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.pbar .row span:last-child{color:var(--sub);font-weight:400}
textarea{width:100%;height:110px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:11px;font-family:inherit;background:#fff;color:var(--ink)}
.btn{display:inline-block;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;
  padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;margin:4px 6px 4px 0}
.btn.solid{background:var(--navy);color:#fff}
.btn.warn{border-color:#B23A3A;color:#B23A3A}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:11px 0 9px;font-size:12px;color:var(--sub);cursor:pointer;font-family:inherit}
nav button.on{color:var(--navy);font-weight:800;border-top:3px solid var(--navy);padding-top:8px}
button:focus-visible,a:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.stamp.done .mark{animation:none}}
@media (min-width:561px){main{padding-top:24px}}
</style>
</head>

const GRAND=CAP.p1+CAP.p2+CAP.p3;
const EXAM='2028-01-08', STARTD='2026-11-02', ENDD='2028-01-09';
const DOW=['日','月','火','水','木','金','土'];
function addDays(s,n){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function diffDays(a,b){return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);}
const IDX={};
PLAN.forEach((w,wi)=>{for(let di=0;di<7;di++){const ds=addDays(w.s,di);IDX[ds]={wi:wi,di:di,q:w.dq[di],ph:w.ph};}});
function calc(checks){
  let total=0;const ph={p1:0,p2:0,p3:0};const weekQ=PLAN.map(function(){return 0});
  for(const d in checks){if(checks[d]!==true)continue;const it=IDX[d];if(!it)continue;
    weekQ[it.wi]+=it.q;if(it.q>0&&ph[it.ph]!==undefined)ph[it.ph]+=it.q;}
  const got={};let sum=0;
  ['p1','p2','p3'].forEach(function(k){got[k]=Math.min(CAP[k],ph[k]);sum+=got[k];});
  const done=PLAN.map(function(w,i){return w.tg>0?weekQ[i]>=w.tg:false;});
  return {total:sum,remain:Math.max(0,GRAND-sum),ph:got,raw:ph,weekQ:weekQ,done:done};
}
function segStr(a,b){let parts=[],pos=a;while(pos<=b){for(let i=0;i<OFFS.length;i++){const o=OFFS[i];if(o[1]<=pos&&pos<=o[2]){const e=Math.min(b,o[2]);parts.push(o[0]+' '+(pos-o[1]+1)+'〜'+(e-o[1]+1));pos=e+1;break;}}}return parts.join('＋');}
function pgStr(a,b){const ps=PMAP.slice(a-1,b);let lo=Infinity,hi=-Infinity;for(const x of ps){if(x<lo)lo=x;if(x>hi)hi=x;}return lo===hi?'p.'+lo:'p.'+lo+'〜'+hi;}
function adjRange(raw,q,cap){if(raw>=cap)return null;const a=raw+1,b=Math.min(raw+q,cap);return {a:a,b:b,s:segStr(a,b),p:pgStr(a,b)};}
function carryPlan(chk,today,raw){
  let d=today;
  for(let i=0;i<420;i++){
    d=addDays(d,1);const ix=IDX[d];
    if(!ix||!ix.ph)continue;
    const w2=PLAN[ix.wi];const q2=(w2.dq&&w2.dq[ix.di])?w2.dq[ix.di]:0;
    if(q2>0&&chk[d]!=='r'){
      const r={nd:d,q:q2,p3:(w2.ph==='p3'),s:'',p:''};
      if(w2.ph!=='p3'){const adj=(raw[w2.ph]>0)?adjRange(raw[w2.ph],q2,CAP[w2.ph]):null;
        if(adj){r.s=adj.s;r.p=adj.p;}}
      return r;}}
  return null;
}
/*CORE-END*/
const DEMO={date:null,tab:null};
const PDFFILE='JSPC試験_内容別編集版_A4.pdf';
const KEY='jspc-check-v1';
const qs=new URLSearchParams(location.search);
const TODAY=(DEMO.date||qs.get('date')||localToday());
function localToday(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function jpDate(s){const m=s.split('-');return (+m[1])+'月'+(+m[2])+'日（'+DOW[new Date(s+'T00:00:00Z').getUTCDay()]+'）';}
let tab=DEMO.tab||qs.get('tab')||'today';
let checks=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(checks))}catch(e){}}
function toggle(d){if(checks[d])delete checks[d];else checks[d]=true;save();render();}
function currentWeek(){let last=-1;for(let i=0;i<PLAN.length;i++){if(PLAN[i].s<=TODAY)last=i;}return last;}
function streak(){let n=0;let d=TODAY;if(!checks[d])d=addDays(d,-1);while(checks[d]){n++;d=addDays(d,-1);}return n;}
const $=function(id){return document.getElementById(id)};
document.querySelectorAll('#tabs button').forEach(function(b){b.addEventListener('click',function(){tab=b.dataset.t;render();});});
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function vToday(){
  const st=calc(checks);let h='';
  h+='<div class="card"><div class="eyebrow">TODAY</div><div class="bigdate num">'+jpDate(TODAY)+'</div>';
  const it=IDX[TODAY];
  if(!it){
    if(TODAY<STARTD){
      h+='<p style="margin-top:8px">学習開始（2026/11/2）まで <b class="num">'+diffDays(TODAY,STARTD)+'</b> 日。</p>';
      h+='<p class="note" style="margin-top:6px">準備期にできること：Ankiデッキの導入・1日1問だけ解いてみる（記録は自由に✓できます）。</p>';h+='<p style="margin-top:8px">初日（11/2）のノルマ：<b class="num">'+(PLAN[0].dr?PLAN[0].dr[0]:'')+'</b>'+(PLAN[0].pg&&PLAN[0].pg[0]?'<span style="font-size:11px;color:var(--sub)">（'+PDFFILE+'・'+PLAN[0].pg[0]+'）</span>':'')+'</p>';
      h+='<div class="eyebrow" style="margin-top:12px">最初の週の予定（11/2〜11/8）</div><div class="days">'+dayPills(0)+'</div>';
    }else{
      h+='<p style="margin-top:8px">試験お疲れさまでした。</p>';
    }
    h+='</div>';return h;
  }
  const w=PLAN[it.wi];
  h+='</div>';
  h+='<div class="wkcard" style="border-left-color:var(--'+w.ph+')">';
  h+='<span class="badge '+w.ph+'">'+esc(w.pl)+'</span>';
  h+='<div class="theme">第'+w.n+'週 '+esc(w.th)+'</div>';
  h+='<div class="td">'+esc(w.td)+'</div>';
  if(w.tg>0){const q=Math.min(st.weekQ[it.wi],w.tg);
    h+='<div class="bar"><i style="width:'+Math.round(100*q/w.tg)+'%"></i></div>';
    h+='<div class="bartext num">今週 '+q+' / '+w.tg+'問'+(st.weekQ[it.wi]>=w.tg?' ・目標達成！':'')+'</div>';}
  h+='<div class="days">'+dayPills(it.wi)+'</div></div>';
  const q=it.q;
  h+='<div class="card"><div class="stampwrap">';
  let norm='',scope='',pg='',lagNote='';
  if(w.ph==='p3'){norm='音読1回（記述7題）';scope=esc(w.th);}
  else if(q>0){norm=q+'問';
    const rawp=st.raw[w.ph];
    const adj=(rawp>0)?adjRange(rawp,q,CAP[w.ph]):null;
    const calA=(w.ab&&w.ab[it.di])?w.ab[it.di][0]:null;
    if(adj){scope=adj.s;pg=adj.p;}
    if(adj&&calA&&adj.a!==calA&&w.dr&&w.dr[it.di]){
      const lag=calA-adj.a;
      lagNote=(lag>0)?'予定より '+lag+'問 の遅れ（カレンダーどおりなら '+esc(w.dr[it.di])+'）。予備週（5/10〜16）や土曜・日曜で追いつけられます':'予定より '+(-lag)+'問 の先取りです';
    }
  }
  if(q>0)h+='<div class="eyebrow">今日のノルマ</div><div style="font-size:15px;font-weight:700" class="num">'+norm+'</div>'+(scope?'<div class="eyebrow" style="margin-top:10px">'+(lagNote?'今日の問題（進捗に合わせて補正）':'今日の問題')+'</div><div class="qrange num">'+scope+'</div>'+(pg?'<div class="pgline num">'+PDFFILE+'・'+pg+'</div>':''):'')+(lagNote?'<div class="note">'+lagNote+'</div>':'');
  else h+='<div class="eyebrow">ノルマなしの日</div><div style="font-size:13px;color:var(--sub);margin-bottom:10px">やった場合は記録だけ残せます</div>';
  h+='<button class="stamp'+(checks[TODAY]===true?' done':'')+'" id="bigbtn" aria-pressed="'+(!!checks[TODAY])+'">';
  h+=(checks[TODAY]===true)?'<span class="mark">✓</span><small>達成済み</small>':'<span class="mark">達成！</span><small>タップして記録</small>';
  h+='</button><div class="streak num">連続達成 <b>'+streak()+'</b> 日</div><button class="btn" id="restbtn">'+(checks[TODAY]==='r'?'お休みを解除':'今日はお休みにする')+'</button>';
  if(checks[TODAY]==='r'){
    const cp=(q>0)?carryPlan(checks,TODAY,st.raw):null;
    let msg='今日はお休みとして記録しています。';
    if(cp){msg='この休み（'+(w.ph==='p3'?'音読1回':q+'問')+'）は、次の学習日 '+jpDate(cp.nd)+' に繰り込まれます'+(cp.s?'（見込み：'+cp.s+'・'+cp.p+'）':'')+'。その分、以降の日の範囲が後ろにずれます。ずれは予備週（5/10〜16）や調整期間（12月）で予定どおりの位置に戻せます。';}
    h+='<div class="note" style="text-align:left;margin-top:10px">'+msg+'</div>';
  }
  h+='</div></div>';
  return h;
}
function dayPills(wi){
  const w=PLAN[wi];if(!w)return'';let h='<div class="days">';
  for(let di=0;di<7;di++){const d=addDays(w.s,di);const q=w.dq[di];
    const cls='day'+(checks[d]===true?' on':'')+(checks[d]==='r'?' rst':'')+(d===TODAY?' me':'')+(q===0?' dim':'');
    h+='<button class="'+cls+'" data-d="'+d+'" aria-pressed="'+(!!checks[d])+'">';
    h+='<span class="w">'+DOW[new Date(d+'T00:00:00Z').getUTCDay()]+'</span><span class="q num">'+(checks[d]==='r'?'休':(q>0?q:'—'))+'</span></button>';}
  return h+'</div>';
}
function vWeeks(){
  const st=calc(checks);const cur=currentWeek();let h='';let lastPh='';
  PLAN.forEach(function(w,i){
    if(w.ph!==lastPh){h+='<div class="sep">'+esc(w.pl)+'</div>';lastPh=w.ph;}
    const q=Math.min(st.weekQ[i],w.tg||0);
    h+='<div class="card" style="padding:11px 12px'+(i===cur?';border-color:var(--navy);border-width:2px':'')+'">';
    h+='<div class="wrow" data-wi="'+i+'"><div><div class="wnum num">第'+w.n+'週</div><div class="wdate num">'+w.s.slice(5).replace('-','/')+'〜'+w.e.slice(5).replace('-','/')+'</div></div>';
    h+='<div><div class="wtheme">'+esc(w.th)+'</div>';
    if(w.tg>0)h+='<div class="td num">週'+q+'/'+w.tg+'問'+(st.done[i]?' ・達成':'')+'</div>';
    h+='</div><div class="dots">';
    for(let di=0;di<7;di++){const d=addDays(w.s,di);h+='<span class="dot'+(checks[d]===true?' on':(checks[d]==='r'?' r':''))+'"></span>';}
    h+='</div></div>';
    if(i===cur||openWeeks.has(i))h+=dayPills(i);
    h+='</div>';
  });
  return h;
}
const openWeeks=new Set();
function vProgress(){
  const st=calc(checks);const left=diffDays(TODAY,EXAM);let h='<div class="stats">';
  h+='<div class="stat"><div class="v num">'+st.total+'</div><div class="l">累計（問）</div></div>';
  h+='<div class="stat"><div class="v num">'+st.remain+'</div><div class="l">残り（問）</div></div>';
  h+='<div class="stat"><div class="v num">'+(left<0?0:left)+'</div><div class="l">試験まで（日）</div></div></div>';
  [['p1','1周目（精読）',28],['p2','2周目（速解き＋Anki）',15],['p3','3周目（口頭特訓・音読）',14]].forEach(function(p){
    const k=p[0];const doneN=PLAN.filter(function(w){return w.ph===k&&w.tg>0&&st.done[PLAN.indexOf(w)];}).length;
    h+='<div class="card pbar"><div class="row"><span>'+p[1]+'</span><span class="num">'+st.ph[k]+' / '+CAP[k]+'問</span></div>';
    h+='<div class="bar"><i class="g" style="width:'+Math.round(100*st.ph[k]/CAP[k])+'%"></i></div>';
    h+='<div class="bartext num">達成週 '+doneN+' / '+p[2]+'</div></div>';
  });
  h+='<p class="note">換算はExcel版と同じ：1周目 平日3問・土5問・日3問（振替）、2周目 5問、3周目 音読1回＝7題。フェーズの目標数で頭打ちします。</p>';
  h+='<p class="note" style="margin-top:4px">試験日は1月第2土曜日の予定（2028/1/8）。必ず<a href="https://www.jspc.gr.jp/specialist/new" target="_blank" rel="noopener">学会HP</a>で確認してください。</p>';
  return h;
}
function vData(){
  let h='<div class="card"><div class="eyebrow">ホーム画面にショートカットを作る</div><p class="note" style="margin-top:4px"><b>Android</b>：このページをChromeで開く → 右上「⋮」→「ホーム画面に追加」<br><b>iPhone・iPad</b>：Safariで開く → 共有アイコン →「ホーム画面に追加」<br>※ iPhoneでローカルのHTMLをSafariで開けないときは、iCloud Driveなどに置いたURLから開くと確実です。記録は端末・ブラウザごとに保存されます。</p></div>'+'<div class="card"><div class="eyebrow">書き出し</div>';
  h+='<p class="note" style="margin:4px 0 8px">記録はこの端末・このブラウザごとに保存されます。機種変更やタブレットへ移すときは、下のテキストをコピーして先で読み込んでください。</p>';
  h+='<textarea id="exp" readonly>'+esc(JSON.stringify({v:1,checks:checks}))+'</textarea>';
  h+='<button class="btn solid" id="copyb">全文コピー</button></div>';
  h+='<div class="card"><div class="eyebrow">読み込み</div>';
  h+='<p class="note" style="margin:4px 0 8px">書き出したテキストを貼り付けて読み込むと、この端末の記録が上書きされます。</p>';
  h+='<textarea id="imp" placeholder="ここに貼り付け"></textarea><button class="btn" id="impb">読み込む</button><span id="impmsg" class="note"></span></div>';
  h+='<div class="card"><div class="eyebrow">初期化</div><button class="btn warn" id="clrb">全チェックを消す</button><span id="clrmsg" class="note"></span></div>';
  return h;
}
function wireData(){
  $('copyb').addEventListener('click',function(){const t=$('exp');t.select();
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value);}
    try{document.execCommand('copy');}catch(e){}
    $('copyb').textContent='コピーしました';});
  $('impb').addEventListener('click',function(){try{
    const o=JSON.parse($('imp').value);if(!o||typeof o!=='object'||!o.checks)throw 0;
    const clean={};for(const k in o.checks){if(IDX[k]&&o.checks[k])clean[k]=(o.checks[k]===true?true:'r');}
    checks=clean;save();render();$('impmsg').textContent='読み込みました（'+Object.keys(clean).length+'日分）';
  }catch(e){$('impmsg').textContent='読み込めませんでした（形式を確認）';}});
  let armed=false;
  $('clrb').addEventListener('click',function(){if(!armed){armed=true;$('clrmsg').textContent='もう一度タップで実行';return;}
    checks={};save();render();$('clrmsg').textContent='消去しました';});
}
function wire(){
  document.querySelectorAll('.day').forEach(function(b){b.addEventListener('click',function(){toggle(b.dataset.d);});});
  const big=$('bigbtn');if(big)big.addEventListener('click',function(){if(checks[TODAY]===true)delete checks[TODAY];else checks[TODAY]=true;save();render();});
  const rb=$('restbtn');if(rb)rb.addEventListener('click',function(){if(checks[TODAY]==='r')delete checks[TODAY];else checks[TODAY]='r';save();render();});
  document.querySelectorAll('.wrow').forEach(function(r){r.addEventListener('click',function(){
    const i=+r.dataset.wi;if(openWeeks.has(i))openWeeks.delete(i);else openWeeks.add(i);render();});});
}
function render(){
  document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab);});
  const left=diffDays(TODAY,EXAM);
  $('chip').textContent=left>0?'試験まで '+left+'日':(left===0?'試験当日':'試験終了');
  $('main').innerHTML=tab==='today'?vToday():tab==='weeks'?vWeeks():tab==='progress'?vProgress():vData();
  wire();if(tab==='data')wireData();
  window.scrollTo(0,0);
}
render();
</script>
