<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#16324f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JSPC手帳" />
<title>JSPC専門医ノルマ手帳</title>
<style>
  :root{ --navy:#16324f; --navy2:#0e2438; --gold:#f4b942; --ink:#1c2b3a; --bad:#b91c1c; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
    color:#fff; min-height:100%;
  }
  #gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:#fff; color:var(--ink); border-radius:16px; padding:28px 24px 22px; width:100%; max-width:360px;
    box-shadow:0 10px 40px rgba(0,0,0,.35); text-align:center;
  }
  .card svg{ display:block; margin:0 auto 10px; }
  .card h1{ margin:0 0 4px; font-size:17px; font-weight:800; color:var(--navy); letter-spacing:.01em; }
  .card p{ margin:0 0 16px; font-size:12px; color:#5b6b7c; }
  .row{ display:flex; gap:8px; }
  input#pass{
    flex:1; min-width:0; font-size:16px; padding:10px 12px; border:1.5px solid #c9d6e2; border-radius:10px;
    color:var(--ink); background:#fff; letter-spacing:.5px;
  }
  input#pass:focus{ outline:none; border-color:var(--navy); }
  button#btn{
    flex:0 0 auto; font-size:14px; font-weight:800; color:var(--navy); background:var(--gold);
    border:0; border-radius:10px; padding:10px 16px; cursor:pointer;
  }
  button#btn:disabled{ opacity:.55; }
  #err{ margin:10px 0 0; font-size:12px; color:var(--bad); min-height:1em; }
  .note{ margin-top:14px; font-size:10.5px; color:#8a99a9; line-height:1.5; }
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="4" y="10" width="16" height="11" rx="2.5" fill="#16324f"/>
      <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#f4b942" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="12" cy="15.2" r="1.7" fill="#f4b942"/>
      <path d="M12 16.2v2" stroke="#f4b942" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <h1>JSPC専門医ノルマ手帳</h1>
    <p>合言葉を入力して解錠してください</p>
    <form id="form" autocomplete="off">
      <div class="row">
        <input id="pass" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="合言葉" />
        <button id="btn" type="submit">解錠</button>
      </div>
      <div id="err"></div>
    </form>
    <div class="note">合言葉を入力するのは各端末で最初の1回だけです。以降は自動的に解錠されます。</div>
  </div>
</div>

(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  function showApp(html) {
    const f = document.createElement('iframe');
    f.setAttribute('title', 'JSPC手帳');
    f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;display:block';
    f.srcdoc = html;
    document.body.appendChild(f);
    document.getElementById('gate').style.display = 'none';
  }
  async function attempt(pass, remember) {
    try {
      const html = await GateCore.unlock(pass, CFG);
      if (remember) { try { localStorage.setItem('__jspc_gate_pass', pass); } catch (e) {} }
      showApp(html);
      return true;
    } catch (e) { return false; }
  }
  async function onSubmit(e) {
    e.preventDefault();
    const btn = $('#btn'), passEl = $('#pass'), err = $('#err');
    err.textContent = '';
    btn.disabled = true;
    const ok = await attempt(passEl.value, true);
    btn.disabled = false;
    if (!ok) { err.textContent = '合言葉が違います'; passEl.select(); }
  }
  (async function boot() {
    let saved = null;
    try { saved = localStorage.getItem('__jspc_gate_pass'); } catch (e) {}
    if (saved && (await attempt(saved, true))) return;
    try { localStorage.removeItem('__jspc_gate_pass'); } catch (e) {}
    $('#form').addEventListener('submit', onSubmit);
  })();
})();
</script>
